<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>로그인 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/login.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title">로그인</h1>

        <p id="login-notice" class="form-notice" role="status" hidden></p>

        <!-- name="username"은 서버 API 필드 이름과 같게 맞춰, 422 에러가 이 칸에 바로 연결되게 한다. -->
        <form id="login-form" class="auth-form" novalidate>
          <div class="field">
            <label for="username">이메일</label>
            <input id="username" name="username" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="username" hidden></p>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <p class="field-error" data-error-for="password" hidden></p>
          </div>

          <p id="login-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block">로그인</button>
        </form>

        <p class="auth-switch auth-switch--forgot">
          <a id="reset-link" href="/static/reset-password.html">비밀번호를 잊으셨나요?</a>
        </p>

        <p class="auth-switch">
          아직 회원이 아니신가요? <a id="signup-link" href="/static/signup.html">회원가입</a>
        </p>
      </section>
    </main>
  </body>
</html>
