<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>사용자 상세 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/admin-user.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin-common.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <nav id="admin-nav" class="admin-nav" aria-label="관리 메뉴"></nav>
      <p class="admin-back"><a href="/static/admin-users.html">← 사용자 목록</a></p>
      <h1 class="page-title" id="user-title">사용자 상세</h1>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <div id="user-detail" class="dashboard" hidden>
        <section class="card admin-card" aria-label="계정 정보">
          <div id="user-badges" class="admin-card__head"></div>
          <dl id="user-info" class="admin-info"></dl>
        </section>

        <p id="action-notice" class="safety-notice" role="status" hidden></p>
        <section id="user-actions" class="card admin-card" aria-labelledby="actions-heading" hidden>
          <h2 class="dashboard__heading" id="actions-heading">조치</h2>
          <div id="action-forms" class="admin-action-list"></div>
        </section>

        <section aria-labelledby="counts-heading">
          <h2 class="dashboard__heading" id="counts-heading">활동</h2>
          <div id="user-counts" class="stat-grid"></div>
        </section>

        <section aria-labelledby="history-heading">
          <h2 class="dashboard__heading" id="history-heading">정지 이력</h2>
          <p class="admin-card__meta">관리 기록에 남은 정지·정지 해제만 보입니다. 모든 조치는 <a id="log-link" href="/static/admin-log.html">관리 기록</a>에서 볼 수 있어요.</p>
          <ul id="suspension-list" class="admin-list"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
