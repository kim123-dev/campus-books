<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>비밀번호 재설정 | Campus Books</title>
    <meta name="i18n-title" content="title.reset" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/reset-password.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title" data-i18n="reset.title">비밀번호 재설정</h1>

        <p class="form-notice" data-i18n="reset.intro">
          가입할 때 정한 본인 확인 질문의 답으로 비밀번호를 바꿀 수 있어요.
        </p>

        <!-- 1단계: 이메일을 넣으면 그 계정의 질문을 보여준다. -->
        <form id="question-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email" data-i18n="field.email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email" hidden></p>
          </div>
          <p id="question-error" class="form-error" role="alert" hidden></p>
          <button type="submit" class="button button--primary button--block" data-i18n="reset.next">다음</button>
        </form>

        <!-- 2단계: 질문의 답 확인. 맞으면 답 칸을 잠그고 3단계를 보여준다. -->
        <form id="verify-form" class="auth-form" novalidate hidden>
          <p class="reset-question__email"><span id="reset-email"></span> <button id="change-email" type="button" class="link-button" data-i18n="reset.change_email">이메일 바꾸기</button></p>
          <div class="field">
            <p class="reset-question__label" data-i18n="term.security_question">본인 확인 질문</p>
            <p id="reset-question" class="reset-question__text"></p>
          </div>

          <div class="field">
            <label for="answer" data-i18n="field.answer">답</label>
            <input id="answer" name="answer" type="text" autocomplete="off" spellcheck="false" maxlength="100" aria-describedby="answer-hint" required />
            <p id="answer-hint" class="field-hint" data-i18n="reset.answer_hint">띄어쓰기와 대소문자는 구분하지 않아요. 24시간에 5번 틀리면 하루 동안 재설정할 수 없어요.</p>
            <p class="field-error" data-error-for="answer" hidden></p>
            <p id="verify-ok" class="field-success" role="status" hidden data-i18n="reset.verify_ok">확인됐어요. 10분 안에 새 비밀번호를 정해 주세요.</p>
          </div>

          <p id="verify-error" class="form-error" role="alert" hidden></p>
          <button id="verify-button" type="submit" class="button button--primary button--block" data-i18n="reset.verify">인증 확인</button>
        </form>

        <!-- 3단계: 답이 맞은 뒤에만 보인다. 서버가 준 확인증으로 새 비밀번호를 정한다. -->
        <form id="reset-form" class="auth-form" novalidate hidden>
          <div class="field">
            <label for="new_password" data-i18n="field.new_password">새 비밀번호</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" aria-describedby="new-password-hint" required />
            <p id="new-password-hint" class="field-hint" data-i18n="field.password_hint">8~64자</p>
            <p class="field-error" data-error-for="new_password" hidden></p>
          </div>

          <div class="field">
            <label for="new_password_confirm" data-i18n="field.new_password_confirm">새 비밀번호 확인</label>
            <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required />
            <p class="field-error" data-error-for="new_password_confirm" hidden></p>
          </div>

          <p id="reset-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block" data-i18n="reset.submit">비밀번호 바꾸기</button>
        </form>

        <p class="auth-switch" data-i18n="reset.admin_note">
          관리자 계정은 이 화면에서 재설정할 수 없어요. 서버 관리 명령으로 재설정합니다.
        </p>

        <p id="reset-switch" class="auth-switch">
          <span data-i18n="reset.remembered">비밀번호가 생각났나요?</span> <a id="login-link" data-i18n="term.login" href="/static/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
