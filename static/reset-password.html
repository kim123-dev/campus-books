<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>비밀번호 재설정 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/reset-password.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title">비밀번호 재설정</h1>

        <p class="form-notice form-notice--warning">
          가입할 때 받은 복구 코드가 있어야 재설정할 수 있어요. 복구 코드를 잃어버렸다면 재설정할 수 없습니다.
        </p>

        <!-- 성공하면 폼 대신 다음에 쓸 새 복구 코드를 보여준다. (recovery-code.js) -->
        <div id="reset-code" hidden></div>

        <form id="reset-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label for="recovery_code">복구 코드</label>
            <input
              id="recovery_code"
              name="recovery_code"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-describedby="recovery-code-hint"
              required
            />
            <p id="recovery-code-hint" class="field-hint">예: ABCD-EFGH-JKMN-PQRS (하이픈은 빼도 돼요)</p>
            <p class="field-error" data-error-for="recovery_code" hidden></p>
          </div>

          <div class="field">
            <label for="new_password">새 비밀번호</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" aria-describedby="new-password-hint" required />
            <p id="new-password-hint" class="field-hint">8~64자</p>
            <p class="field-error" data-error-for="new_password" hidden></p>
          </div>

          <div class="field">
            <label for="new_password_confirm">새 비밀번호 확인</label>
            <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required />
            <p class="field-error" data-error-for="new_password_confirm" hidden></p>
          </div>

          <p id="reset-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block">비밀번호 바꾸기</button>
        </form>

        <p id="reset-switch" class="auth-switch">
          비밀번호가 생각났나요? <a id="login-link" href="/static/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
