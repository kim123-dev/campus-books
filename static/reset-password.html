<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>비밀번호 재설정 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/reset-password.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title">비밀번호 재설정</h1>

        <p class="form-notice">
          가입할 때 정한 본인 확인 질문의 답으로 비밀번호를 바꿀 수 있어요.
        </p>

        <!-- 1단계: 이메일을 넣으면 그 계정의 질문을 보여준다. -->
        <form id="question-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email" hidden></p>
          </div>
          <p id="question-error" class="form-error" role="alert" hidden></p>
          <button type="submit" class="button button--primary button--block">다음</button>
        </form>

        <!-- 2단계: 질문의 답과 새 비밀번호 -->
        <form id="reset-form" class="auth-form" novalidate hidden>
          <p class="reset-question__email"><span id="reset-email"></span> <button id="change-email" type="button" class="link-button">이메일 바꾸기</button></p>
          <div class="field">
            <p class="reset-question__label">본인 확인 질문</p>
            <p id="reset-question" class="reset-question__text"></p>
          </div>

          <div class="field">
            <label for="answer">답</label>
            <input id="answer" name="answer" type="text" autocomplete="off" spellcheck="false" maxlength="100" aria-describedby="answer-hint" required />
            <p id="answer-hint" class="field-hint">띄어쓰기와 대소문자는 구분하지 않아요. 24시간에 5번 틀리면 하루 동안 재설정할 수 없어요.</p>
            <p class="field-error" data-error-for="answer" hidden></p>
          </div>

          <div class="field">
            <label for="new_password">새 비밀번호</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" aria-describedby="new-password-hint" required />
            <p id="new-password-hint" class="field-hint">8~64자</p>
            <p class="field-error" data-error-for="new_password" hidden></p>
          </div>

          <div class="field">
            <label for="new_password_confirm">새 비밀번호 확인</label>
            <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required />
            <p class="field-error" data-error-for="new_password_confirm" hidden></p>
          </div>

          <p id="reset-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block">비밀번호 바꾸기</button>
        </form>

        <p class="auth-switch">
          관리자 계정은 이 화면에서 재설정할 수 없어요. 서버 관리 명령으로 재설정합니다.
        </p>

        <p id="reset-switch" class="auth-switch">
          비밀번호가 생각났나요? <a id="login-link" href="/static/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
