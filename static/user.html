<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>프로필 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/user.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <p class="back-link"><a href="/static/index.html">← 목록으로</a></p>

      <p id="page-status" class="result-summary" aria-live="polite">불러오는 중…</p>

      <!-- 없거나 탈퇴한 사용자, 잘못된 주소, 서버 연결 실패 -->
      <div id="page-error" class="card page-error" hidden>
        <p id="page-error-text" class="form-error" role="alert"></p>
        <a class="button" href="/static/index.html">목록으로</a>
      </div>

      <div id="profile" hidden>
        <!-- 닉네임과 매너 점수. 이메일 등 개인정보는 서버가 보내지 않는다. -->
        <section class="card profile" aria-labelledby="profile-name">
          <h1 id="profile-name" class="profile__name"></h1>
          <div id="profile-manner" class="profile__manner"></div>
        </section>

        <section class="profile-section" aria-labelledby="posts-title">
          <h2 id="posts-title" class="profile-section__title">판매 중인 글</h2>
          <p id="posts-summary" class="result-summary" aria-live="polite"></p>
          <ul id="post-list" class="post-list"></ul>
          <nav id="posts-pagination" class="pagination" aria-label="판매 중인 글 페이지 이동"></nav>
        </section>

        <section class="profile-section" aria-labelledby="reviews-title">
          <h2 id="reviews-title" class="profile-section__title">받은 거래 후기</h2>
          <p id="reviews-summary" class="result-summary" aria-live="polite"></p>
          <ul id="review-list" class="review-list"></ul>
          <nav id="reviews-pagination" class="pagination" aria-label="받은 후기 페이지 이동"></nav>
        </section>
      </div>
    </main>
  </body>
</html>
