<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>후기 관리 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/admin-reviews.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin-common.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <nav id="admin-nav" class="admin-nav" aria-label="관리 메뉴"></nav>
      <h1 class="page-title">후기 관리</h1>
      <p class="page-description">숨긴 후기는 받은 사람의 프로필과 매너 학점에서 빠집니다. 숨김을 풀면 바로 다시 보여요.</p>

      <nav class="tabs" aria-label="후기 보기">
        <a class="tabs__item" data-status="HIDDEN" href="?status=HIDDEN">숨긴 후기</a>
        <a class="tabs__item" data-status="ALL" href="?status=ALL">전체</a>
      </nav>
      <p id="filter-user" class="admin-filter__user" hidden></p>

      <p id="admin-notice" class="safety-notice" role="status" hidden></p>
      <p id="result-summary" class="result-summary" aria-live="polite">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <ul id="review-list" class="admin-list"></ul>
      <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
    </main>
  </body>
</html>
