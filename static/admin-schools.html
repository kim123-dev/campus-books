<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>학교 관리 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/admin-schools.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin-common.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <nav id="admin-nav" class="admin-nav" aria-label="관리 메뉴"></nav>
      <h1 class="page-title">학교 관리</h1>
      <p class="page-description">
        사용자가 고를 수 있는 학교 목록입니다. 비활성으로 바꾸면 새로 고를 수 없지만, 이미 연결된 글·사용자의 학교 표시는 그대로 남습니다.
      </p>

      <p id="admin-notice" class="safety-notice" role="status" hidden></p>
      <section class="card admin-card" aria-labelledby="add-heading">
        <h2 class="dashboard__heading" id="add-heading">학교 추가</h2>
        <form id="school-add-form" class="admin-school-form" novalidate>
          <div class="field">
            <label for="school-name">이름</label>
            <input id="school-name" name="name" type="text" maxlength="100" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="school-order">순서 (작을수록 위)</label>
            <input id="school-order" name="sort_order" type="number" min="0" max="9999" value="0" inputmode="numeric" />
          </div>
          <p class="form-error" role="alert" hidden></p>
          <button type="submit" class="button button--primary">추가</button>
        </form>
      </section>

      <h2 class="dashboard__heading admin-section-heading">학교 목록</h2>
      <p id="result-summary" class="result-summary" aria-live="polite">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>
      <ul id="school-list" class="admin-list"></ul>
    </main>
  </body>
</html>
