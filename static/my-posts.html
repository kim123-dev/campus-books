<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>내 글 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/my-posts.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <h1 class="page-title">내 글</h1>

      <!-- 내 정보는 헤더가 받아 온 /users/me 결과로 채운다. -->
      <section id="profile" class="card profile-card" aria-label="내 정보" hidden>
        <div class="profile-card__info">
          <p id="profile-nickname" class="profile-card__nickname"></p>
          <p id="profile-meta" class="profile-card__meta"></p>
        </div>
        <div class="profile-card__actions">
          <a class="button" href="/static/blocks.html">차단 목록</a>
          <a class="button button--primary" href="/static/post-form.html">글쓰기</a>
        </div>
      </section>

      <p id="result-summary" class="result-summary" aria-live="polite">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <p id="empty-actions" class="empty-actions" hidden>
        <a class="button button--primary" href="/static/post-form.html">첫 글 쓰기</a>
      </p>

      <ul id="post-list" class="post-list"></ul>
      <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
    </main>
  </body>
</html>
