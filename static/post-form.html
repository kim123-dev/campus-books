<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>판매글 작성 | Campus Books</title>
    <meta name="i18n-title" content="title.post_form" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/post-form.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <p id="page-status" class="result-summary" aria-live="polite" data-i18n="common.loading">불러오는 중…</p>

      <!-- 수정할 수 없는 글(남의 글, 판매 완료, 없는 글)이면 폼 대신 보여준다. -->
      <div id="page-error" class="card page-error" hidden>
        <p id="page-error-text" class="form-error" role="alert"></p>
        <a id="page-error-link" class="button" data-i18n="common.back_to_list" href="/static/index.html">목록으로</a>
      </div>

      <section id="form-card" class="card form-card" hidden>
        <h1 id="form-title" class="page-title" data-i18n="form.title_new">판매글 작성</h1>

        <!-- 각 칸의 name은 API 필드 이름과 같게 맞춰, 422 에러가 해당 칸 아래에 바로 연결되게 한다. -->
        <!-- maxlength 등은 서버 규칙과 같게 둔 입력 편의용이고, 실제 검사는 서버가 한다. -->
        <form id="post-form" class="post-form" novalidate>
          <div class="field">
            <label for="title" data-i18n="field.title">제목</label>
            <input id="title" name="title" type="text" maxlength="100" required />
            <p class="field-error" data-error-for="title" hidden></p>
          </div>

          <div class="field">
            <label for="book_title" data-i18n="field.book_title">교재명</label>
            <input id="book_title" name="book_title" type="text" maxlength="200" required />
            <p class="field-error" data-error-for="book_title" hidden></p>
          </div>

          <div class="field">
            <label for="course_name" data-i18n="field.course_optional">과목명 (선택)</label>
            <input id="course_name" name="course_name" type="text" maxlength="100" aria-describedby="course-hint" />
            <p id="course-hint" class="field-hint" data-i18n="form.course_hint">목록의 과목명 필터는 정확히 일치할 때만 찾습니다.</p>
            <p class="field-error" data-error-for="course_name" hidden></p>
          </div>

          <!-- 학교(선택). 목록은 post-form.js가 /schools로 채우고, 학교가 비어 있으면 내 학교를 미리 고른다. -->
          <!-- 내 학교도 없이 비워 두면 아래에 작은 안내를 보여준다(등록은 막지 않는다). -->
          <div class="field">
            <label for="school_id" data-i18n="field.school_optional">학교 (선택)</label>
            <select id="school_id" name="school_id" aria-describedby="school-note">
              <option value="" data-i18n="school.none">선택 안 함</option>
            </select>
            <p id="school-note" class="field-hint post-form__school-note" data-i18n="form.school_none_note" hidden>학교 없이 올리면 학교별 목록에 안 보여요</p>
            <p class="field-error" data-error-for="school_id" hidden></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="condition" data-i18n="field.condition">책 상태</label>
              <select id="condition" name="condition" required>
                <option value="" data-i18n="form.choose">선택해 주세요</option>
                <option value="GOOD" data-i18n="enum.condition.GOOD">상</option>
                <option value="FAIR" data-i18n="enum.condition.FAIR">중</option>
                <option value="POOR" data-i18n="enum.condition.POOR">하</option>
              </select>
              <p class="field-error" data-error-for="condition" hidden></p>
            </div>

            <div class="field">
              <label for="price" data-i18n="field.price">가격 (원)</label>
              <input
                id="price"
                name="price"
                type="number"
                min="0"
                max="10000000"
                step="1"
                inputmode="numeric"
                aria-describedby="price-hint"
                required
              />
              <p id="price-hint" class="field-hint" data-i18n="form.price_hint">0원이면 무료 나눔으로 표시됩니다.</p>
              <p class="field-error" data-error-for="price" hidden></p>
            </div>
          </div>

          <div class="field">
            <label for="description" data-i18n="field.description_optional">설명 (선택)</label>
            <textarea id="description" name="description" rows="8" maxlength="2000"></textarea>
            <p class="field-error" data-error-for="description" hidden></p>
          </div>

          <!-- 사진은 글 저장 뒤에 한 장씩 따로 올린다. (static/js/pages/post-form.js) -->
          <div class="field">
            <span class="field-label" id="photos-label" data-i18n="field.photos_optional">사진 (선택)</span>
            <ul id="photo-list" class="photo-list" aria-labelledby="photos-label"></ul>
            <div class="photo-picker">
              <input
                id="photos"
                class="visually-hidden"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                multiple
                aria-describedby="photo-count"
              />
              <label for="photos" class="button photo-picker__button" data-i18n="form.add_photo">사진 추가</label>
              <span id="photo-count" class="photo-picker__count" aria-live="polite">0/3</span>
            </div>
            <!-- 사진 줄이는 중… (1/3) (static/js/pages/post-form.js) -->
            <p id="photo-status" class="photo-status" aria-live="polite" hidden></p>
            <p id="photos-error" class="field-error" role="alert" hidden></p>
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>

          <div class="form-actions">
            <button type="submit" class="button button--primary" data-i18n="form.create">등록하기</button>
            <a id="cancel-link" class="button" data-i18n="common.cancel" href="/static/index.html">취소</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
