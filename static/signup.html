<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>회원가입 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/signup.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title">회원가입</h1>

        <form id="signup-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              aria-describedby="password-hint"
              required
            />
            <p id="password-hint" class="field-hint">8~64자</p>
            <p class="field-error" data-error-for="password" hidden></p>
          </div>

          <div class="field">
            <label for="password_confirm">비밀번호 확인</label>
            <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required />
            <p class="field-error" data-error-for="password_confirm" hidden></p>
          </div>

          <div class="field">
            <label for="nickname">닉네임</label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              autocomplete="nickname"
              aria-describedby="nickname-hint"
              required
            />
            <p id="nickname-hint" class="field-hint">2~30자, 다른 학생에게 판매자 이름으로 보입니다.</p>
            <p class="field-error" data-error-for="nickname" hidden></p>
          </div>

          <p id="signup-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block">가입하기</button>
        </form>

        <p class="auth-switch">
          이미 회원이신가요? <a id="login-link" href="/static/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
