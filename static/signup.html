<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>회원가입 | Campus Books</title>
    <meta name="i18n-title" content="title.signup" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/signup.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <section class="card auth-card">
        <h1 class="page-title" data-i18n="term.signup">회원가입</h1>

        <form id="signup-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email" data-i18n="field.email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label for="password" data-i18n="field.password">비밀번호</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              aria-describedby="password-hint"
              required
            />
            <p id="password-hint" class="field-hint" data-i18n="field.password_hint">8~64자</p>
            <p class="field-error" data-error-for="password" hidden></p>
          </div>

          <div class="field">
            <label for="password_confirm" data-i18n="field.password_confirm">비밀번호 확인</label>
            <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required />
            <p class="field-error" data-error-for="password_confirm" hidden></p>
          </div>

          <div class="field">
            <label for="nickname" data-i18n="field.nickname">닉네임</label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              autocomplete="nickname"
              aria-describedby="nickname-hint"
              required
            />
            <p id="nickname-hint" class="field-hint" data-i18n="signup.nickname_hint">2~30자, 다른 학생에게 판매자 이름으로 보입니다.</p>
            <p class="field-error" data-error-for="nickname" hidden></p>
          </div>

          <!-- 학교(선택). 목록은 signup.js가 /schools로 채우고, 고를 수 있는 학교가 하나뿐이면 미리 고른다. -->
          <div class="field">
            <label for="school_id" data-i18n="field.school_optional">학교 (선택)</label>
            <select id="school_id" name="school_id" aria-describedby="school-hint">
              <option value="" data-i18n="school.none">선택 안 함</option>
            </select>
            <p id="school-hint" class="field-hint" data-i18n="signup.school_hint">같은 학교 글을 모아 볼 수 있어요. 내 정보에서 바꿀 수 있어요.</p>
            <p class="field-error" data-error-for="school_id" hidden></p>
          </div>

          <!-- 본인 확인 질문과 답 (security-question.js가 채운다) -->
          <fieldset class="question-fields">
            <legend data-i18n="signup.question_legend">비밀번호를 잊었을 때</legend>
            <div id="signup-question-fields"></div>
          </fieldset>

          <p id="signup-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="button button--primary button--block" data-i18n="signup.submit">가입하기</button>
        </form>

        <p id="signup-switch" class="auth-switch">
          <span data-i18n="signup.have_account">이미 회원이신가요?</span> <a id="login-link" data-i18n="term.login" href="/static/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
