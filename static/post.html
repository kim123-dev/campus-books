<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>판매글 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/post.js"></script>
  </head>
  <body data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <p class="back-link"><a href="/static/index.html">← 목록으로</a></p>

      <p id="page-status" class="result-summary" aria-live="polite">불러오는 중…</p>

      <!-- 글을 불러오지 못했을 때(404, 잘못된 주소, 서버 연결 실패) 글 영역 대신 보여준다. -->
      <div id="page-error" class="card page-error" hidden>
        <p id="page-error-text" class="form-error" role="alert"></p>
        <a class="button" href="/static/index.html">목록으로</a>
      </div>

      <article id="post-detail" class="card post-detail" hidden></article>

      <!-- 내 글일 때만 보인다. 실제 권한 검사는 서버(403)가 한다. -->
      <section id="owner-panel" class="card owner-panel" aria-labelledby="owner-panel-title" hidden>
        <h2 id="owner-panel-title" class="owner-panel__title">내 글 관리</h2>
        <div id="owner-actions" class="owner-actions"></div>
        <p id="action-error" class="form-error" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>
