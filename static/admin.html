<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>신고 관리 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/pages/admin.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <h1 class="page-title">신고 관리</h1>
      <p class="page-description">
        조치를 고르고 "처리하기"를 누르면 확인 후 바로 적용됩니다. 처리한 신고는 되돌릴 수 없어요.
      </p>

      <nav class="tabs" aria-label="신고 상태">
        <a class="tabs__item" data-status="PENDING" href="?status=PENDING">미처리</a>
        <a class="tabs__item" data-status="RESOLVED" href="?status=RESOLVED">처리됨</a>
        <a class="tabs__item" data-status="ALL" href="?status=ALL">전체</a>
      </nav>

      <p id="admin-notice" class="safety-notice" role="status" hidden></p>
      <p id="result-summary" class="result-summary" aria-live="polite">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <ul id="report-list" class="report-list"></ul>
      <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
    </main>
  </body>
</html>
