<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>사용자 관리 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/admin-users.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin-common.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <nav id="admin-nav" class="admin-nav" aria-label="관리 메뉴"></nav>
      <h1 class="page-title">사용자 관리</h1>
      <p class="page-description">이메일은 관리 화면 중 이 화면과 사용자 상세에서만 보입니다. 업무에 필요할 때만 확인해 주세요.</p>

      <p class="admin-filter__user"><a href="/static/admin-bans.html">재가입 차단 목록 보기</a></p>

      <form id="user-search" class="admin-filter" role="search">
        <div class="field">
          <label for="search-q">검색</label>
          <input id="search-q" name="q" type="search" maxlength="100" placeholder="닉네임·이메일 또는 #번호" />
        </div>
        <div class="field">
          <label for="filter-status">상태</label>
          <select id="filter-status" name="status">
            <option value="">전체 (탈퇴 제외)</option>
            <option value="SUSPENDED">정지 중</option>
            <option value="ADMIN">관리자</option>
            <option value="WITHDRAWN">탈퇴한 계정</option>
          </select>
        </div>
        <button type="submit" class="button button--primary admin-filter__submit">검색</button>
      </form>

      <p id="result-summary" class="result-summary" aria-live="polite">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <ul id="user-list" class="admin-list"></ul>
      <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
    </main>
  </body>
</html>
