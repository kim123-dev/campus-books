<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>관리 대시보드 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/admin-dashboard.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <!-- 관리자만 쓰는 화면. 관리자가 아니면 admin-common.js가 목록 화면으로 보낸다. 실제 권한 검사는 서버가 한다. -->
    <main class="container" id="admin-main" hidden>
      <nav id="admin-nav" class="admin-nav" aria-label="관리 메뉴"></nav>
      <h1 class="page-title">대시보드</h1>
      <p id="dashboard-date" class="page-description">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>

      <div id="dashboard" class="dashboard" hidden>
        <section class="dashboard__section" aria-labelledby="dash-reports">
          <h2 id="dash-reports" class="dashboard__heading">신고</h2>
          <div class="stat-grid" id="stat-reports"></div>
        </section>
        <section class="dashboard__section" aria-labelledby="dash-users">
          <h2 id="dash-users" class="dashboard__heading">가입자</h2>
          <div class="stat-grid" id="stat-users"></div>
        </section>
        <section class="dashboard__section" aria-labelledby="dash-posts">
          <h2 id="dash-posts" class="dashboard__heading">판매글</h2>
          <div class="stat-grid" id="stat-posts"></div>
        </section>
      </div>
    </main>
  </body>
</html>
