<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: 안드로이드 Chrome에서 키보드가 올라오면 화면 높이(dvh)도 줄어 입력창이 키보드 위에 남는다.
         iOS Safari는 이 값을 모르므로 chat.js가 visualViewport 높이로 맞춘다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>쪽지 | Campus Books</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/chat.js"></script>
  </head>
  <body class="chat-body" data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <p class="back-link"><a href="/static/conversations.html">← 쪽지함</a></p>

      <p id="page-status" class="result-summary" aria-live="polite">불러오는 중…</p>

      <!-- 대화방을 열 수 없을 때(없는 방, 남의 방, 잘못된 주소, 서버 연결 실패) 대화 영역 대신 보여준다. -->
      <div id="page-error" class="card page-error" hidden>
        <p id="page-error-text" class="form-error" role="alert"></p>
        <a class="button" href="/static/conversations.html">쪽지함으로</a>
      </div>

      <section id="chat" class="card chat" aria-labelledby="chat-partner" hidden>
        <div class="chat__header">
          <h1 id="chat-partner" class="chat__partner"></h1>
          <p id="chat-post" class="chat__post"></p>
          <!-- 이 상대와 거래가 기록되어 있으면 후기 남기기 줄. chat.js가 대화방 정보를 받은 뒤 그린다. -->
          <div id="chat-review" class="chat__review" hidden></div>
          <!-- 신고·차단. 버튼은 chat.js가 대화방 정보를 받은 뒤 그린다. -->
          <div id="chat-actions" class="chat__actions"></div>
          <p id="chat-safety-notice" class="safety-notice" role="status" hidden></p>
        </div>

        <!-- 메시지 영역만 스크롤된다. 맨 위에 닿으면 이전 메시지를 더 불러온다. -->
        <div id="chat-scroll" class="chat__scroll" tabindex="0" aria-label="메시지 목록">
          <div id="older-sentinel" class="chat__sentinel" aria-hidden="true"></div>
          <p class="chat__older">
            <button id="older-button" type="button" class="link-button" hidden>이전 메시지 보기</button>
          </p>
          <p id="chat-empty" class="chat__empty" hidden>아직 메시지가 없습니다. 첫 메시지를 보내 보세요.</p>
          <ol id="message-list" class="message-list"></ol>
        </div>

        <div class="chat__float">
          <button id="new-message-button" type="button" class="chat__new-messages" hidden>새 메시지 ↓</button>
        </div>
        <p id="connection-status" class="chat__connection" role="status" hidden></p>

        <form id="message-form" class="chat__form" novalidate>
          <p class="chat__privacy">
            전화번호·계좌번호·집 주소 같은 개인정보는 거래가 확정된 뒤 신중하게 공유하세요.
            직거래는 학교 안 사람이 많은 곳에서 하세요.
          </p>
          <!-- 차단 관계라 보낼 수 없을 때 입력창 대신 보이는 안내 -->
          <p id="chat-blocked" class="chat__blocked" hidden></p>
          <label for="content" class="visually-hidden">보낼 메시지</label>
          <!-- maxlength는 서버 규칙(1000자)과 같게 둔 입력 편의용이고, 실제 검사는 서버가 한다. -->
          <textarea
            id="content"
            name="content"
            rows="2"
            maxlength="1000"
            placeholder="메시지를 입력하세요"
            aria-describedby="content-count"
          ></textarea>
          <p class="field-error" data-error-for="content" hidden></p>
          <div class="chat__form-bottom">
            <span id="content-count" class="chat__count">0 / 1000</span>
            <!-- 사진 쪽지: 버튼을 누르면 숨긴 파일 선택창을 연다. 한 번에 한 장씩 보낸다. -->
            <input id="photo-input" type="file" accept="image/*" class="visually-hidden" tabindex="-1" aria-hidden="true" />
            <button id="photo-button" type="button" class="button chat__photo-button" aria-label="사진 보내기">사진</button>
            <button type="submit" class="button button--primary">보내기</button>
          </div>
          <p id="send-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
