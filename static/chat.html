<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: 안드로이드 Chrome에서 키보드가 올라오면 화면 높이(dvh)도 줄어 입력창이 키보드 위에 남는다.
         iOS Safari는 이 값을 모르므로 chat.js가 visualViewport 높이로 맞춘다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>쪽지 | Campus Books</title>
    <meta name="i18n-title" content="title.chat" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/chat.js"></script>
  </head>
  <body class="chat-body" data-tab-bar="off">
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <p class="back-link"><a href="/static/conversations.html">← <span data-i18n="term.inbox">쪽지함</span></a></p>

      <p id="page-status" class="result-summary" aria-live="polite" data-i18n="common.loading">불러오는 중…</p>

      <!-- 대화방을 열 수 없을 때(없는 방, 남의 방, 잘못된 주소, 서버 연결 실패) 대화 영역 대신 보여준다. -->
      <div id="page-error" class="card page-error" hidden>
        <p id="page-error-text" class="form-error" role="alert"></p>
        <a class="button" data-i18n="chat.to_inbox" href="/static/conversations.html">쪽지함으로</a>
      </div>

      <section id="chat" class="card chat" aria-labelledby="chat-partner" hidden>
        <div class="chat__header">
          <!-- 상대 닉네임 줄. 오른쪽 끝의 ⋯(더보기) 버튼은 chat.js가 대화방 정보를 받은 뒤 그린다. 누르면 신고·차단 메뉴. -->
          <div class="chat__title-row">
            <h1 id="chat-partner" class="chat__partner"></h1>
            <div id="chat-actions" class="chat__actions"></div>
          </div>
          <p id="chat-post" class="chat__post"></p>
          <!-- 이 상대와 거래가 기록되어 있으면 후기 남기기 줄. chat.js가 대화방 정보를 받은 뒤 그린다. -->
          <div id="chat-review" class="chat__review" hidden></div>
          <p id="chat-safety-notice" class="safety-notice" role="status" hidden></p>
        </div>

        <!-- 메시지 영역만 스크롤된다. 맨 위에 닿으면 이전 메시지를 더 불러온다. -->
        <div id="chat-scroll" class="chat__scroll" tabindex="0" aria-label="메시지 목록" data-i18n-attr="aria-label:chat.list_aria">
          <div id="older-sentinel" class="chat__sentinel" aria-hidden="true"></div>
          <p class="chat__older">
            <button id="older-button" type="button" class="link-button" hidden data-i18n="chat.older">이전 메시지 보기</button>
          </p>
          <p id="chat-empty" class="chat__empty" hidden data-i18n="chat.empty">아직 메시지가 없습니다. 첫 메시지를 보내 보세요.</p>
          <!-- 대화가 비어 있을 때만 보이는 짧은 개인정보 안내 -->
          <p id="chat-empty-hint" class="chat__empty-hint" hidden data-i18n="chat.privacy_short">개인정보는 거래가 확정된 뒤 신중하게 공유하세요.</p>
          <ol id="message-list" class="message-list"></ol>
        </div>

        <div class="chat__float">
          <button id="new-message-button" type="button" class="chat__new-messages" hidden data-i18n="chat.new_messages">새 메시지 ↓</button>
        </div>
        <p id="connection-status" class="chat__connection" role="status" hidden></p>

        <form id="message-form" class="chat__form" novalidate>
          <!-- 차단 관계라 보낼 수 없을 때 입력창 대신 보이는 안내 -->
          <p id="chat-blocked" class="chat__blocked" hidden></p>
          <label for="content" class="visually-hidden" data-i18n="chat.input_label">보낼 메시지</label>
          <!-- 입력 줄: [+ 사진 추가] [입력칸(남는 폭 전부)] [보내기]. +를 누르면 숨긴 파일 선택창을 연다. 한 번에 한 장씩 보낸다. -->
          <input id="photo-input" type="file" accept="image/*" class="visually-hidden" tabindex="-1" aria-hidden="true" />
          <button id="photo-button" type="button" class="chat__photo-button" aria-label="사진 추가" data-i18n-attr="aria-label:chat.add_photo_aria"></button>
          <!-- maxlength는 서버 규칙(1000자)과 같게 둔 입력 편의용이고, 실제 검사는 서버가 한다. -->
          <textarea
            id="content"
            name="content"
            rows="2"
            maxlength="1000"
            placeholder="메시지를 입력하세요"
            data-i18n-attr="placeholder:chat.placeholder"
            aria-describedby="content-count"
          ></textarea>
          <button type="submit" class="button button--primary chat__send" data-i18n="chat.send">보내기</button>
          <p class="field-error" data-error-for="content" hidden></p>
          <!-- 입력 줄 아래 오른쪽: 사진 보내는 중(준비 중·%) 표시와 글자 수 -->
          <div class="chat__form-bottom">
            <span id="photo-progress" class="chat__count chat__photo-progress" aria-live="polite" hidden></span>
            <span id="content-count" class="chat__count">0 / 1000</span>
          </div>
          <p id="send-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
