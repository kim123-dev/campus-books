<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>
    <title>알림 | Campus Books</title>
    <meta name="i18n-title" content="title.alerts" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- 홈 화면 앱(PWA): 앱 정보·아이콘, 아이폰 홈 화면 아이콘과 이름, 서비스 워커 등록 -->
    <meta name="theme-color" content="#5b3fd6" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Books" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" src="/static/js/pwa.js"></script>
    <script type="module" src="/static/js/pages/alerts.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main class="container">
      <h1 class="page-title" data-i18n="term.notifications">알림</h1>

      <!-- 안 읽은 쪽지 수. 헤더가 이미 받아 둔 숫자를 쓴다(auth.js unreadMessageCount). 누르면 쪽지함. -->
      <ul id="unread-messages" class="settings-list" hidden>
        <li><a class="settings-row" href="/static/conversations.html"><span id="unread-messages-text"></span></a></li>
      </ul>

      <!-- 찾는 교재 알림(조건에 맞는 새 글)과 안 쓴 후기 알림을 구분 제목 없이 시간순으로 섞는다.
           조건 등록은 찾는 교재 화면(book-alerts.html)에서 한다. -->
      <p id="result-summary" class="result-summary" aria-live="polite" data-i18n="common.loading">불러오는 중…</p>
      <p id="list-error" class="form-error" role="alert" hidden></p>
      <!-- 알림이 하나도 없을 때만 보인다. -->
      <p id="empty-actions" class="empty-actions" hidden>
        <a class="button button--primary" data-i18n="alerts.register_link" href="/static/book-alerts.html">찾는 교재 등록하기</a>
      </p>
      <ul id="notification-list" class="notification-list"></ul>
      <nav id="pagination" class="pagination" aria-label="페이지 이동" data-i18n-attr="aria-label:common.pagination_aria"></nav>
    </main>
  </body>
</html>
