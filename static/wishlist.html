  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 화면 언어를 그리기 전에 정한다(<html lang>, 깜빡임 방지). 모듈보다 먼저 실행되는 일반 스크립트 -->
    <script src="/static/js/lang-boot.js"></script>

    <meta name="theme-color" content="#5b3fd6" />

    <script type="module" src="/static/js/pwa.js"></script>
    <!-- 찜 목록은 내 정보 화면의 탭으로 옮겼다. 이 주소로 들어오면 그 탭으로 보낸다. -->
    <script src="/static/js/legacy-me-redirect.js" data-tab="wishlist"></script>
